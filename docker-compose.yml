services:
  backend:
    build:
      context: ./backend
    environment:
      DATA_DIR: /app/data
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-768}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-latest}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash-lite}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      ENABLE_CROSS_ENCODER: ${ENABLE_CROSS_ENCODER:-false}
      EVIDENCE_THRESHOLD: ${EVIDENCE_THRESHOLD:-0.45}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-800}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      WARN_THRESHOLD: ${WARN_THRESHOLD:-0.50}
      LARGE_CONTEXT_TOKENS: ${LARGE_CONTEXT_TOKENS:-3000}
      RECOMMENDED_TOP_K: ${RECOMMENDED_TOP_K:-3}
      SHORT_OUTPUT_TOKENS: ${SHORT_OUTPUT_TOKENS:-300}
      NEAR_BUDGET_RATIO: ${NEAR_BUDGET_RATIO:-0.20}
      REPEAT_WINDOW_DAYS: ${REPEAT_WINDOW_DAYS:-7}
      ANONYMIZED_TELEMETRY: "False"
      SEED_SAMPLE_DOCUMENTS: ${SEED_SAMPLE_DOCUMENTS:-true}
      SAMPLE_DOCUMENTS_DIR: /app/sample_documents
      ENVIRONMENT: ${ENVIRONMENT:-local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      RATE_LIMIT_CHAT_PER_MINUTE: ${RATE_LIMIT_CHAT_PER_MINUTE:-10}
      RATE_LIMIT_ESTIMATE_PER_MINUTE: ${RATE_LIMIT_ESTIMATE_PER_MINUTE:-20}
      RATE_LIMIT_UPLOAD_PER_HOUR: ${RATE_LIMIT_UPLOAD_PER_HOUR:-10}
    volumes:
      - ./data:/app/data
      - ./sample_documents:/app/sample_documents:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      PUBLIC_DEMO: ${PUBLIC_DEMO:-false}
    depends_on:
      - backend
    ports:
      - "8501:8501"
